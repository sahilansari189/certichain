{% load static %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');
    
    /* Override parent HTML layout containers to ensure the certificate canvas scales accurately without wrapping */
    .cert-display-container {
        width: 100% !important;
        max-width: 1122px !important;
        padding: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        min-width: min(100vw - 40px, 1122px);
    }

    .certificate-v4 {
        width: 100%;
        max-width: 1122px !important; /* Forces physical A4 maximum boundary visually */
        position: relative;
        margin: 0 auto;
        font-family: 'Montserrat', sans-serif;
        /* Next line ensures proper scaling. We set container-type so we can use cqi for perfectly scaling fonts */
        container-type: inline-size;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        background-color: #fff;
        
        /* Disable text selection so it feels like a solid image */
        -webkit-user-select: none; 
        -moz-user-select: none; 
        -ms-user-select: none; 
        user-select: none;
        
        /* Fallback if JS fails */
        --cqi: 11.22px;
    }
    
    .cert-spacer {
        width: 100%;
        padding-top: 70.70707%; /* Aspect Ratio Hack: 210/297. Ensures accurate height calculation for PDF absolute % positioning */
        display: block;
    }
    
    .cert-bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 1;
    }
    
    .cert-content-v4 {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    /* Position the QR Code */
    .cert-v4-qr {
        position: absolute;
        top: 10.5%;
        right: 6%;
        width: 12%;
        height: auto;
        aspect-ratio: 1/1;
        background-color: transparent; /* Mask the static QR behind it */
        padding: 4px;
        border-radius: 4px;
    }

    /* Center Text positioning */
    .cert-v4-name {
        position: absolute;
        top: 44%;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: calc(var(--cqi) * 3.2);
        font-weight: 700;
        color: #0370b8;
        text-transform: uppercase;
        letter-spacing: calc(var(--cqi) * 0.1);
    }
    
    .cert-v4-course {
        position: absolute;
        top: 60%;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: calc(var(--cqi) * 2.3);
        font-weight: 800;
        color: #1a1a1a;
        text-transform: uppercase;
        letter-spacing: calc(var(--cqi) * 0.05);
    }

    .cert-v4-code {
        position: absolute;
        top: 67.7%;
        right: 57.8%; /* Locks the right edge exactly where DM181 ended */
        text-align: right; /* Forces long strings to expand backwards to the left */
        font-size: calc(var(--cqi) * 2.05);
        color: #555555;
        font-weight: 500;
        z-index: 5;
    }

    /* Masking element for the course provider to overwrite static text on the background */
    .cert-v4-code span {
        background-color: transparent;
        padding: 0px 8px;
        border-radius: 2px;
    }

    /* Bottom Left Dynamic Values */
    .val-date { 
        position: absolute; 
        top: 80.9%;
        left: 11.4%;     
        color: #6b7280; 
        font-weight: 600; 
        font-size: calc(var(--cqi) * 1.12); 
        text-transform: uppercase; 
    }
    
    .val-id { 
        position: absolute; 
        top: 84.8%;
        left: 18.1%;
        color: #555555; 
        font-weight: 600; 
        font-size: calc(var(--cqi) * 1.05);
        background-color: transparent;
        padding: 0 2px;
    }

    /* AUTHENTICITY URL: last line of bottom-left block at ~91% */
    .val-url { 
        position: absolute; 
        top: 89.5%;
        left: 5.4%; 
        color: #0074cc; 
        font-weight: 500; 
        font-size: calc(var(--cqi) * 0.95); 
        text-decoration: underline; 
        white-space: nowrap;
        background-color: transparent;
        padding: 0 2px;
    }
    
    @media print {
        .certificate-v4 { box-shadow: none; }
    }
</style>

<div class="certificate-v4" id="certificate-v4-wrapper">
    <div class="cert-spacer"></div>
    <img src="{% static 'images/cert_v4.png' %}" class="cert-bg-image" alt="Certificate Background">
    
    <div class="cert-content-v4">
        <!-- Dynamic QR Code — overlays and replaces the static one -->
        <img src="data:image/png;base64,{{ qr_code }}" class="cert-v4-qr" alt="QR Code">
        
        <!-- Learner Name -->
        <div class="cert-v4-name">{{ certificate.user.get_full_name }}</div>

        <!-- Course Title -->
        <div class="cert-v4-course">{{ course.title }}</div>

        <!-- Code + Provider (white bg masks the baked-in static text below) -->
        <div class="cert-v4-code">
            <span>{{ course.code }}</span>
        </div>

        <!-- Bottom Left: Date -->
        <div class="val-date">{{ certificate.created_at|date:'F d, Y' }}</div>

        <!-- Bottom Left: Certificate UID -->
        <div class="val-id">{{ certificate.uid }}</div>

        <!-- Bottom Left: Authenticity URL -->
        <a href="{{ certificate_url }}" class="val-url" target="_blank">{{ certificate_url }}</a>
    </div>
</div>

<script>
    // html2canvas struggles to capture responsive 'cqi' units inside cloned iframes during PDF generation
    // To bulletproof ensure everything stays perfectly laid out, we dynamically assign a static pixel --cqi variable to the wrapper.
    function updateCqiScale() {
        var wrapper = document.getElementById('certificate-v4-wrapper');
        if (wrapper) {
            // Equivalent to standard '1cqi' calculation
            var cqiValue = wrapper.clientWidth / 100;
            wrapper.style.setProperty('--cqi', cqiValue + 'px');
        }
    }
    window.addEventListener('resize', updateCqiScale);
    updateCqiScale();
</script>
