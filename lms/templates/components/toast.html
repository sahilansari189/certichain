{% if messages %}
<div id="toastContainer" class="fixed top-20 right-4 z-50 space-y-3">
    {% for message in messages %}
    <div class="toast-message bg-white border-l-4 {% if message.tags == 'success' %}border-green-500{% elif message.tags == 'error' %}border-red-500{% elif message.tags == 'warning' %}border-yellow-500{% else %}border-[#001F5C]{% endif %} rounded-lg shadow-xl p-4 min-w-80 transform translate-x-full opacity-0 transition-all duration-500 ease-out font-ibm">
        <div class="flex items-start">
            <div class="flex-shrink-0 mr-3">
                {% if message.tags == 'success' %}
                    <i class="fas fa-check-circle text-green-500 text-xl"></i>
                {% elif message.tags == 'error' %}
                    <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fas fa-exclamation-triangle text-yellow-500 text-xl"></i>
                {% else %}
                    <i class="fas fa-info-circle text-[#001F5C] text-xl"></i>
                {% endif %}
            </div>
            <div class="flex-1">
                <p class="text-gray-900 font-medium text-lg">{{ message }}</p>
            </div>
            <button class="flex-shrink-0 ml-3 text-gray-400 hover:text-gray-600 transition-colors duration-200" onclick="closeToast(this)">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>
    </div>
    {% endfor %}
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
    
    .font-ibm {
        font-family: 'IBM Plex Sans', sans-serif;
    }
    
    .toast-show {
        transform: translateX(0) !important;
        opacity: 1 !important;
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toasts = document.querySelectorAll('.toast-message');
    
    // Show toasts with staggered animation
    toasts.forEach((toast, index) => {
        setTimeout(() => {
            toast.classList.add('toast-show');
        }, index * 150);
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
            closeToast(toast.querySelector('button'));
        }, 5000 + (index * 150));
    });
});

function closeToast(button) {
    const toast = button.closest('.toast-message');
    toast.style.transform = 'translateX(100%)';
    toast.style.opacity = '0';
    
    setTimeout(() => {
        toast.remove();
        
        // Remove container if no toasts left
        const container = document.getElementById('toastContainer');
        if (container && container.children.length === 0) {
            container.remove();
        }
    }, 300);
}
</script>
{% endif %}
